<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">DA-04 Week 3 conceptual packaging mockup</title><desc id="desc">Not-to-scale block schematic of a mobile dual-arm concept. Battery, drive conditions, and mobile stability remain open.</desc>
<defs><style>.bg{fill:#f7fafc}.ink{fill:#183247;font:700 22px Arial}.sub{fill:#3d566c;font:14px Arial}.line{stroke:#294b65;stroke-width:18;stroke-linecap:round;fill:none}.joint{fill:#f2b84b;stroke:#573f16;stroke-width:3}.body{fill:#dce8f2;stroke:#244a69;stroke-width:3}.base{fill:#aebfcd;stroke:#314b5f;stroke-width:3}.wheel{fill:#546575;stroke:#243a4a;stroke-width:3}.box{fill:#fff;stroke:#87a1b5;stroke-width:2}.warn{fill:#fff1e8;stroke:#c76a37;stroke-width:2}.dash{fill:none;stroke:#45866b;stroke-width:4;stroke-dasharray:9 7}.label{fill:#183247;font:700 16px Arial}.small{fill:#334f64;font:14px Arial}.footer{fill:#8b3d20;font:700 16px Arial}</style></defs>
<rect class="bg" width="1100" height="650"/><text class="ink" x="40" y="42">DA-04 · Humanoid Mobile Dual-Arm</text><text class="sub" x="40" y="70">INTERN-01 · concept targets only · not to scale · paper mockup, not CAD</text>
<rect class="box" x="40" y="100" width="300" height="76" rx="10"/><text class="label" x="58" y="130">Envelope target</text><text class="small" x="58" y="154">1200 × 1200 mm (concept target)</text>
<rect class="box" x="760" y="100" width="300" height="76" rx="10"/><text class="label" x="780" y="130">Baseline count</text><text class="small" x="780" y="154">4 DOF / arm + 2 drive channels</text>
<path class="line" d="M420 250 L330 215 L260 255 L200 225 M680 250 L770 215 L840 255 L900 225"/><circle class="joint" cx="420" cy="250" r="17"/><circle class="joint" cx="330" cy="215" r="15"/><circle class="joint" cx="260" cy="255" r="14"/><circle class="joint" cx="680" cy="250" r="17"/><circle class="joint" cx="770" cy="215" r="15"/><circle class="joint" cx="840" cy="255" r="14"/>
<rect class="body" x="450" y="200" width="200" height="220" rx="16"/><rect class="body" x="500" y="145" width="100" height="65" rx="12"/><text class="label" x="518" y="184">Fixed head</text><text class="label" x="485" y="300">Torso / compute</text><text class="small" x="489" y="327">battery not drawn</text>
