<rect class="body" x="490" y="280" width="120" height="135" rx="12"/><text class="label" x="505" y="345">Central</text><text class="label" x="506" y="366">enclosure</text><rect class="base" x="440" y="415" width="220" height="32" rx="4"/><text class="small" x="452" y="474">Fixed tabletop support · support/clamp details TBD</text>
<path class="dash" d="M550 280 L550 205"/><text class="small" x="570" y="220">Optional mast (owner decision)</text>
<rect class="warn" x="40" y="520" width="1020" height="80" rx="10"/><text class="footer" x="60" y="550">Open: source README lists shoulder yaw + elbow + wrist; a Week 3 shoulder-pitch case also exists.</text><text class="small" x="60" y="576">Confirm axes and wrist direction before accepting torque mapping. No dimensions here are manufacturing dimensions.</text>
