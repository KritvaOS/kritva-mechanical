<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
<title id="title">DA-01 Week 3 conceptual packaging mockup</title><desc id="desc">Not-to-scale block schematic of a fixed tabletop dual-arm concept. Axis and wrist labels remain unresolved; this is not CAD or a fabrication drawing.</desc>
<defs><style>.bg{fill:#f7fafc}.ink{fill:#183247;font:700 22px Arial}.sub{fill:#3d566c;font:14px Arial}.line{stroke:#294b65;stroke-width:18;stroke-linecap:round;fill:none}.joint{fill:#f2b84b;stroke:#573f16;stroke-width:3}.body{fill:#dce8f2;stroke:#244a69;stroke-width:3}.base{fill:#aebfcd;stroke:#314b5f;stroke-width:3}.box{fill:#fff;stroke:#87a1b5;stroke-width:2}.warn{fill:#fff1e8;stroke:#c76a37;stroke-width:2}.dash{fill:none;stroke:#45866b;stroke-width:4;stroke-dasharray:9 7}.label{fill:#183247;font:700 16px Arial}.small{fill:#334f64;font:14px Arial}.footer{fill:#8b3d20;font:700 16px Arial}</style></defs>
<rect class="bg" width="1100" height="650"/><text class="ink" x="40" y="42">DA-01 · Fixed Tabletop Dual-Arm</text><text class="sub" x="40" y="70">INTERN-01 · concept targets only · not to scale · paper mockup, not CAD</text>
<rect class="box" x="40" y="100" width="290" height="76" rx="10"/><text class="label" x="58" y="130">Envelope targets</text><text class="small" x="58" y="154">700 W × 400 H mm · base 300 × 250 mm</text>
<rect class="box" x="770" y="100" width="290" height="76" rx="10"/><text class="label" x="790" y="130">Arm target</text><text class="small" x="790" y="154">350 mm reach each side · 3 DOF / arm</text>
