<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">KMECH-CONCEPT-QR-04 — Agile Long-Leg Quadruped</title>
<desc id="desc">Side and top schematic views of an agile long-leg quadruped with four articulated legs and three degrees of freedom per leg.</desc>
<defs>
<style>
text{font-family:Arial,sans-serif;fill:#20394b}.h{font-size:27px;font-weight:bold}.sub{font-size:15px;fill:#526575}.pt{font-size:19px;font-weight:bold}.lb{font-size:14px}.sm{font-size:12px;fill:#526575}.jl{font-size:12px;font-weight:bold}.joint{fill:#f3f6f8;stroke:#31566f;stroke-width:4}.core{fill:#31566f}.leg{fill:none;stroke:#477b9e;stroke-width:17;stroke-linecap:round;stroke-linejoin:round}.detail{fill:none;stroke:#a9c4d5;stroke-width:5;stroke-linecap:round}.body{fill:#dce5eb;stroke:#344e60;stroke-width:3}.leader{fill:none;stroke:#718695;stroke-width:1.5}.panel{fill:#fbfcfd;stroke:#c9d4dc;stroke-width:2}.foot{fill:#53616b;stroke:#344e60;stroke-width:2}
</style>
</defs>
<rect width="1200" height="800" fill="#fff"/>
<text x="50" y="48" class="h">KMECH-CONCEPT-QR-04</text>
<text x="50" y="76" class="sub">Agile Long-Leg Quadruped | Concept architecture schematic</text>
<path d="M50 96H1150" stroke="#c9d4dc" stroke-width="2"/>
<!-- side view -->
<rect x="45" y="120" width="700" height="490" rx="10" class="panel"/>
<text x="70" y="155" class="pt">SIDE VIEW</text>
<text x="70" y="178" class="sm">Extended leg geometry with three joints per leg</text>
<!-- body -->
<path d="M220 270Q390 245 560 270L575 340Q390 370 205 340Z" class="body"/>
<rect x="285" y="285" width="210" height="35" rx="8" fill="#c6d3dc" stroke="#344e60" stroke-width="2"/>
<!-- front leg: hip, upper-leg joint, knee -->
<path d="M270 330L245 390L205 465L185 550" class="leg"/>
<path d="M270 330L245 390L205 465L185 550" class="detail"/>
<circle cx="270" cy="330" r="15" class="joint"/><circle cx="270" cy="330" r="5" class="core"/>
<circle cx="245" cy="390" r="13" class="joint"/><circle cx="245" cy="390" r="5" class="core"/>
<circle cx="205" cy="465" r="14" class="joint"/><circle cx="205" cy="465" r="5" class="core"/>
<path d="M185 550l-20 5h38" class="foot"/>
<!-- rear leg -->
<path d="M510 330L535 390L575 465L595 550" class="leg"/>
<path d="M510 330L535 390L575 465L595 550" class="detail"/>
<circle cx="510" cy="330" r="15" class="joint"/><circle cx="510" cy="330" r="5" class="core"/>
<circle cx="535" cy="390" r="13" class="joint"/><circle cx="535" cy="390" r="5" class="core"/>
<circle cx="575" cy="465" r="14" class="joint"/><circle cx="575" cy="465" r="5" class="core"/>
<path d="M595 550l-20 5h38" class="foot"/>
<!-- far-side legs -->
<path d="M300 340L320 405L300 475L285 535M480 340L460 405L480 475L495 535" fill="none" stroke="#91a8b8" stroke-width="10" stroke-dasharray="6 5" stroke-linecap="round"/>
<text x="85" y="225" class="lb">Body chassis</text><path d="M165 230L235 275" class="leader"/>
<text x="75" y="345" class="jl">J1 hip</text><path d="M130 341L255 330" class="leader"/>
<text x="75" y="405" class="jl">J2 upper-leg</text><path d="M165 401L235 390" class="leader"/>
<text x="75" y="480" class="jl">J3 knee</text><path d="M135 476L195 465" class="leader"/>
<text x="395" y="585" text-anchor="middle" class="sm">Ground contact plane</text>
<path d="M110 555H660" stroke="#718695" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="610" y="390" class="sm">Long leg</text><text x="610" y="407" class="sm">segments</text><path d="M605 412L580 450" class="leader"/>
<!-- top view -->
<rect x="770" y="120" width="385" height="490" rx="10" class="panel"/>
<text x="795" y="155" class="pt">TOP VIEW</text>
<text x="795" y="178" class="sm">Plan layout — indicative only</text>
<text x="962" y="218" text-anchor="middle" class="sm">FRONT</text>
<path d="M962 225v24m-7-8l7-9 7 9" class="leader"/>
<rect x="910" y="305" width="105" height="190" rx="16" class="body"/>
<rect x="925" y="325" width="75" height="150" rx="8" fill="#c6d3dc" stroke="#718695" stroke-width="2"/>
<text x="962" y="405" text-anchor="middle" class="sm">Body</text>
<!-- four legs with hip, intermediate and knee locations -->
<path d="M910 335L875 305L845 270L810 235M1015 335L1050 305L1080 270L1115 235M910 465L875 495L845 530L810 565M1015 465L1050 495L1080 530L1115 565" class="leg"/>
<circle cx="910" cy="335" r="12" class="joint"/><circle cx="875" cy="305" r="11" class="joint"/><circle cx="845" cy="270" r="11" class="joint"/>
<circle cx="1015" cy="335" r="12" class="joint"/><circle cx="1050" cy="305" r="11" class="joint"/><circle cx="1080" cy="270" r="11" class="joint"/>
<circle cx="910" cy="465" r="12" class="joint"/><circle cx="875" cy="495" r="11" class="joint"/><circle cx="845" cy="530" r="11" class="joint"/>
<circle cx="1015" cy="465" r="12" class="joint"/><circle cx="1050" cy="495" r="11" class="joint"/><circle cx="1080" cy="530" r="11" class="joint"/>
<circle cx="810" cy="235" r="8" class="foot"/><circle cx="1115" cy="235" r="8" class="foot"/>
<circle cx="810" cy="565" r="8" class="foot"/><circle cx="1115" cy="565" r="8" class="foot"/>
<text x="795" y="590" class="sm">Four long articulated legs</text>
<!-- summary -->
<rect x="45" y="635" width="1110" height="105" rx="8" fill="#f3f6f8" stroke="#c9d4dc" stroke-width="2"/>
<text x="70" y="665" class="pt">CONCEPT SUMMARY</text>
<text x="70" y="691" class="lb">Configuration: agile long-leg quadruped with four articulated legs</text>
<text x="70" y="715" class="lb">Joint arrangement: 3 DOF per leg (12 total leg joints) — illustrative arrangement</text>
<text x="1125" y="765" text-anchor="end" font-size="14" font-weight="bold" fill="#9a3f32">PROPOSED concept sketch, not to scale, no CAD</text>
</svg>
