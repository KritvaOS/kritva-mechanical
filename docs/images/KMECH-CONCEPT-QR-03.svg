<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">KMECH-CONCEPT-QR-03 — Low-Profile Quadruped</title>
<desc id="desc">Side and top schematic views of a low-profile quadruped with four legs and two degrees of freedom per leg.</desc>
<defs>
<style>
text{font-family:Arial,sans-serif;fill:#20394b}.h{font-size:27px;font-weight:bold}.sub{font-size:15px;fill:#526575}.pt{font-size:19px;font-weight:bold}.lb{font-size:14px}.sm{font-size:12px;fill:#526575}.jl{font-size:12px;font-weight:bold}.joint{fill:#f3f6f8;stroke:#31566f;stroke-width:4}.core{fill:#31566f}.leg{fill:none;stroke:#477b9e;stroke-width:17;stroke-linecap:round;stroke-linejoin:round}.detail{fill:none;stroke:#a9c4d5;stroke-width:5;stroke-linecap:round}.body{fill:#dce5eb;stroke:#344e60;stroke-width:3}.leader{fill:none;stroke:#718695;stroke-width:1.5}.panel{fill:#fbfcfd;stroke:#c9d4dc;stroke-width:2}.foot{fill:#53616b;stroke:#344e60;stroke-width:2}
</style>
</defs>
<rect width="1200" height="800" fill="#fff"/>
<text x="50" y="48" class="h">KMECH-CONCEPT-QR-03</text>
<text x="50" y="76" class="sub">Low-Profile Quadruped | Concept architecture schematic</text>
<path d="M50 96H1150" stroke="#c9d4dc" stroke-width="2"/>
<!-- side view -->
<rect x="45" y="120" width="700" height="490" rx="10" class="panel"/>
<text x="70" y="155" class="pt">SIDE VIEW</text>
<text x="70" y="178" class="sm">Low-profile body with four articulated two-joint legs</text>
<!-- low body chassis -->
<path d="M190 300Q390 275 590 300L600 355Q390 380 180 355Z" class="body"/>
<rect x="245" y="310" width="300" height="30" rx="7" fill="#c6d3dc" stroke="#344e60" stroke-width="2"/>
<!-- near front leg -->
<path d="M255 350L235 425L215 510" class="leg"/><path d="M255 350L235 425L215 510" class="detail"/>
<circle cx="255" cy="350" r="15" class="joint"/><circle cx="255" cy="350" r="5" class="core"/>
<circle cx="235" cy="425" r="14" class="joint"/><circle cx="235" cy="425" r="5" class="core"/>
<path d="M215 510l-18 5h35" class="foot"/>
<!-- near rear leg -->
<path d="M525 350L545 425L565 510" class="leg"/><path d="M525 350L545 425L565 510" class="detail"/>
<circle cx="525" cy="350" r="15" class="joint"/><circle cx="525" cy="350" r="5" class="core"/>
<circle cx="545" cy="425" r="14" class="joint"/><circle cx="545" cy="425" r="5" class="core"/>
<path d="M565 510l-18 5h35" class="foot"/>
<!-- far-side legs -->
<path d="M290 355L305 430L290 505M490 355L475 430L490 505" fill="none" stroke="#91a8b8" stroke-width="10" stroke-dasharray="6 5" stroke-linecap="round"/>
<text x="85" y="245" class="lb">Low-profile chassis</text><path d="M190 250L245 300" class="leader"/>
<text x="75" y="365" class="jl">J1 hip</text><path d="M130 361L240 350" class="leader"/>
<text x="75" y="440" class="jl">J2 knee</text><path d="M135 436L225 425" class="leader"/>
<text x="395" y="570" text-anchor="middle" class="sm">Ground contact plane</text>
<path d="M110 515H660" stroke="#718695" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="600" y="390" class="sm">Compact vertical</text><text x="600" y="407" class="sm">body profile</text><path d="M595 412L565 365" class="leader"/>
<!-- top view -->
<rect x="770" y="120" width="385" height="490" rx="10" class="panel"/>
<text x="795" y="155" class="pt">TOP VIEW</text>
<text x="795" y="178" class="sm">Plan layout — indicative only</text>
<text x="962" y="218" text-anchor="middle" class="sm">FRONT</text>
<path d="M962 225v24m-7-8l7-9 7 9" class="leader"/>
<rect x="900" y="320" width="125" height="155" rx="10" class="body"/>
<rect x="915" y="335" width="95" height="125" rx="6" fill="#c6d3dc" stroke="#718695" stroke-width="2"/>
<text x="962" y="405" text-anchor="middle" class="sm">Low body</text>
<!-- four two-joint legs -->
<path d="M900 345L860 310L825 270M1025 345L1065 310L1100 270M900 450L860 485L825 525M1025 450L1065 485L1100 525" class="leg"/>
<circle cx="900" cy="345" r="12" class="joint"/><circle cx="860" cy="310" r="12" class="joint"/>
<circle cx="1025" cy="345" r="12" class="joint"/><circle cx="1065" cy="310" r="12" class="joint"/>
<circle cx="900" cy="450" r="12" class="joint"/><circle cx="860" cy="485" r="12" class="joint"/>
<circle cx="1025" cy="450" r="12" class="joint"/><circle cx="1065" cy="485" r="12" class="joint"/>
<circle cx="825" cy="270" r="8" class="foot"/><circle cx="1100" cy="270" r="8" class="foot"/>
<circle cx="825" cy="525" r="8" class="foot"/><circle cx="1100" cy="525" r="8" class="foot"/>
<text x="795" y="575" class="sm">Four legs, two DOF each</text>
<text x="795" y="593" class="sm">Compact plan arrangement</text>
<!-- summary -->
<rect x="45" y="635" width="1110" height="105" rx="8" fill="#f3f6f8" stroke="#c9d4dc" stroke-width="2"/>
<text x="70" y="665" class="pt">CONCEPT SUMMARY</text>
<text x="70" y="691" class="lb">Configuration: low-profile quadruped with four articulated legs</text>
<text x="70" y="715" class="lb">Joint arrangement: 2 DOF per leg (8 total leg joints) — illustrative arrangement</text>
<text x="1125" y="765" text-anchor="end" font-size="14" font-weight="bold" fill="#9a3f32">PROPOSED concept sketch, not to scale, no CAD</text>
</svg>
