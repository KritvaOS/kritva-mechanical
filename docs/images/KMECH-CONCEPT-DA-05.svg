<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">KMECH-CONCEPT-DA-05 — Rotating Platform Dual-Arm</title>
<desc id="desc">Front and top schematic views of a rotating platform carrying two three-degree-of-freedom articulated arms.</desc>
<defs>
<style>
