<path d="M510 345L530 405L560 475L575 530" class="leg"/>
<path d="M510 345L530 405L560 475L575 530" class="detail"/>
<circle cx="510" cy="345" r="15" class="joint"/><circle cx="510" cy="345" r="5" class="core"/>
