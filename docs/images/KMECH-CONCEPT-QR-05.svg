<path d="M270 345L250 405L220 475L205 530" class="leg"/>
<path d="M270 345L250 405L220 475L205 530" class="detail"/>
<circle cx="270" cy="345" r="15" class="joint"/><circle cx="270" cy="345" r="5" class="core"/>
<rect x="237" y="392" width="26" height="26" rx="5" class="module"/>
