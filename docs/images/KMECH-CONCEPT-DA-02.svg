<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="svgTitle svgDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="svgTitle">KMECH-CONCEPT-DA-02 — Humanoid Torso Dual-Arm Robot</title>
  <desc id="svgDesc">Proposed schematic showing front and top views of a fixed humanoid torso with two four-degree-of-freedom arms.</desc>

  <defs>
    <style>
      .title { font: bold 27px sans-serif; fill: #172b3a; }
      .subtitle { font: 15px sans-serif; fill: #526575; }
      .panel-title { font: bold 19px sans-serif; fill: #20394b; }
      .label { font: 14px sans-serif; fill: #263d4d; }
      .small { font: 12px sans-serif; fill: #526575; }
      .joint-label { font: bold 12px sans-serif; fill: #20394b; }
      .structure { fill: #dce5eb; stroke: #344e60; stroke-width: 3; }
      .arm { fill: none; stroke: #477b9e; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
      .arm-detail { fill: none; stroke: #a9c4d5; stroke-width: 5; stroke-linecap: round; }
      .joint { fill: #f3f6f8; stroke: #31566f; stroke-width: 4; }
      .joint-core { fill: #31566f; }
      .leader { fill: none; stroke: #718695; stroke-width: 1.5; }
      .panel { fill: #fbfcfd; stroke: #c9d4dc; stroke-width: 2; }
      .gripper { fill: none; stroke: #31566f; stroke-width: 6; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>

  <text x="50" y="48" class="title">KMECH-CONCEPT-DA-02</text>
  <text x="50" y="76" class="subtitle">Humanoid Torso Dual-Arm Robot | Concept architecture schematic</text>
  <line x1="50" y1="96" x2="1150" y2="96" stroke="#c9d4dc" stroke-width="2"/>

  <!-- FRONT VIEW -->
  <rect x="45" y="120" width="700" height="490" rx="10" class="panel"/>
  <text x="70" y="155" class="panel-title">FRONT VIEW</text>
  <text x="70" y="178" class="small">Fixed torso structure with two articulated 4-DOF arms</text>

  <!-- Torso and fixed support -->
  <path d="M320 255 Q395 225 470 255 L490 430 Q395 460 300 430 Z" class="structure"/>
  <path d="M345 255 L345 220 Q395 195 445 220 L445 255" class="structure"/>
  <rect x="350" y="430" width="90" height="35" rx="4" class="structure"/>
  <rect x="300" y="465" width="190" height="18" rx="3" fill="#aebdc7" stroke="#344e60" stroke-width="2"/>
  <rect x="330" y="483" width="130" height="70" rx="5" class="structure"/>
  <rect x="300" y="553" width="190" height="16" rx="3" fill="#aebdc7" stroke="#344e60" stroke-width="2"/>

  <!-- Left arm: shoulder, upper arm, elbow, forearm, wrist -->
  <path d="M320 280 L245 315 L205 405 L175 465" class="arm"/>
  <path d="M320 280 L245 315 L205 405 L175 465" class="arm-detail"/>
  <circle cx="320" cy="280" r="16" class="joint"/>
  <circle cx="320" cy="280" r="6" class="joint-core"/>
  <circle cx="245" cy="315" r="14" class="joint"/>
  <circle cx="245" cy="315" r="5" class="joint-core"/>
  <circle cx="205" cy="405" r="16" class="joint"/>
  <circle cx="205" cy="405" r="6" class="joint-core"/>
  <circle cx="175" cy="465" r="13" class="joint"/>
  <circle cx="175" cy="465" r="5" class="joint-core"/>
  <path d="M175 465 L145 475 M175 465 L160 495" class="gripper"/>

  <!-- Right arm -->
  <path d="M470 280 L545 315 L585 405 L615 465" class="arm"/>
  <path d="M470 280 L545 315 L585 405 L615 465" class="arm-detail"/>
  <circle cx="470" cy="280" r="16" class="joint"/>
  <circle cx="470" cy="280" r="6" class="joint-core"/>
  <circle cx="545" cy="315" r="14" class="joint"/>
  <circle cx="545" cy="315" r="5" class="joint-core"/>
  <circle cx="585" cy="405" r="16" class="joint"/>
  <circle cx="585" cy="405" r="6" class="joint-core"/>
  <circle cx="615" cy="465" r="13" class="joint"/>
  <circle cx="615" cy="465" r="5" class="joint-core"/>
  <path d="M615 465 L645 475 M615 465 L630 495" class="gripper"/>

  <!-- Front view labels -->
  <text x="85" y="235" class="label">Left arm</text>
  <path d="M150 239 L210 270 L235 300" class="leader"/>
  <text x="610" y="235" class="label">Right arm</text>
  <path d="M610 240 L570 270 L555 300" class="leader"/>

  <text x="395" y="345" text-anchor="middle" class="label">Humanoid</text>
  <text x="395" y="364" text-anchor="middle" class="label">torso</text>
  <path d="M395 370 L395 405" class="leader"/>

  <text x="75" y="300" class="joint-label">J1</text>
  <path d="M100 296 L300 280" class="leader"/>
  <text x="75" y="350" class="joint-label">J2</text>
  <path d="M100 346 L230 320" class="leader"/>
  <text x="75" y="415" class="joint-label">J3</text>
  <path d="M100 411 L190 405" class="leader"/>
  <text x="75" y="485" class="joint-label">J4</text>
  <path d="M100 481 L160 465" class="leader"/>

  <text x="645" y="300" class="joint-label">J1</text>
  <path d="M640 296 L490 280" class="leader"/>
  <text x="645" y="350" class="joint-label">J2</text>
  <path d="M640 346 L560 320" class="leader"/>
  <text x="645" y="415" class="joint-label">J3</text>
  <path d="M640 411 L600 405" class="leader"/>
  <text x="645" y="485" class="joint-label">J4</text>
  <path d="M640 481 L630 465" class="leader"/>

  <text x="395" y="595" text-anchor="middle" class="small">Fixed torso mounting support</text>

  <!-- TOP VIEW -->
  <rect x="770" y="120" width="385" height="490" rx="10" class="panel"/>
  <text x="795" y="155" class="panel-title">TOP VIEW</text>
  <text x="795" y="178" class="small">Plan layout — indicative only</text>

  <!-- Torso footprint -->
  <rect x="925" y="260" width="75" height="210" rx="12" fill="#dce5eb" stroke="#344e60" stroke-width="3"/>
  <text x="962" y="370" text-anchor="middle" class="small">Torso</text>

  <!-- Left arm top projection -->
  <path d="M925 300 L870 300 L835 255 L815 220" class="arm"/>
  <circle cx="925" cy="300" r="12" class="joint"/>
  <circle cx="870" cy="300" r="12" class="joint"/>
  <circle cx="835" cy="255" r="12" class="joint"/>
  <circle cx="815" cy="220" r="10" class="joint"/>
  <path d="M815 220 L800 205 M815 220 L825 200" class="gripper"/>

  <!-- Right arm top projection -->
  <path d="M1000 300 L1055 300 L1090 255 L1110 220" class="arm"/>
  <circle cx="1000" cy="300" r="12" class="joint"/>
  <circle cx="1055" cy="300" r="12" class="joint"/>
  <circle cx="1090" cy="255" r="12" class="joint"/>
  <circle cx="1110" cy="220" r="10" class="joint"/>
  <path d="M1110 220 L1095 205 M1110 220 L1120 200" class="gripper"/>

  <!-- Fixed mounting footprint -->
  <rect x="900" y="465" width="125" height="32" rx="4" fill="#c6d3dc" stroke="#344e60" stroke-width="2"/>
  <text x="962" y="520" text-anchor="middle" class="small">Fixed support</text>

  <text x="800" y="565" class="small">Left and right arms extend from torso</text>
  <text x="800" y="582" class="small">shoulder mounts in a mirrored layout</text>

  <!-- Architecture summary -->
  <rect x="45" y="635" width="1110" height="105" rx="8" fill="#f3f6f8" stroke="#c9d4dc" stroke-width="2"/>
  <text x="70" y="665" class="panel-title">CONCEPT SUMMARY</text>
  <text x="70" y="691" class="label">Configuration: fixed humanoid torso with two independently articulated arms</text>
  <text x="70" y="715" class="label">Joint arrangement: 4 DOF per arm (8 total arm joints) — illustrative arrangement</text>

  <text x="1125" y="765" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9a3f32">PROPOSED concept sketch, not to scale, no CAD</text>
</svg>
