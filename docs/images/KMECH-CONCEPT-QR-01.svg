<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">KMECH-CONCEPT-QR-01 — Compact Quadruped</title>
<desc id="desc">Side and top schematic views of a compact quadruped with four legs and two degrees of freedom per leg.</desc>
<defs>
<style>
text{font-family:Arial,sans-serif;fill:#20394b}.h{font-size:27px;font-weight:bold}.sub{font-size:15px;fill:#526575}.pt{font-size:19px;font-weight:bold}.lb{font-size:14px}.sm{font-size:12px;fill:#526575}.jl{font-size:12px;font-weight:bold}.joint{fill:#f3f6f8;stroke:#31566f;stroke-width:4}.core{fill:#31566f}.leg{fill:none;stroke:#477b9e;stroke-width:17;stroke-linecap:round;stroke-linejoin:round}.detail{fill:none;stroke:#a9c4d5;stroke-width:5;stroke-linecap:round}.body{fill:#dce5eb;stroke:#344e60;stroke-width:3}.leader{fill:none;stroke:#718695;stroke-width:1.5}.panel{fill:#fbfcfd;stroke:#c9d4dc;stroke-width:2}.foot{fill:#53616b;stroke:#344e60;stroke-width:2}
</style>
</defs>
<rect width="1200" height="800" fill="#fff"/>
<text x="50" y="48" class="h">KMECH-CONCEPT-QR-01</text>
<text x="50" y="76" class="sub">Compact Quadruped | Concept architecture schematic</text>
<path d="M50 96H1150" stroke="#c9d4dc" stroke-width="2"/>
<!-- side view -->
<rect x="45" y="120" width="700" height="490" rx="10" class="panel"/>
<text x="70" y="155" class="pt">SIDE VIEW</text>
<text x="70" y="178" class="sm">Compact four-legged platform; two joints per leg</text>
<!-- body and legs, near side -->
<path d="M230 285Q390 260 550 285L570 350Q390 380 210 350Z" class="body"/>
<rect x="285" y="300" width="190" height="38" rx="8" fill="#c6d3dc" stroke="#344e60" stroke-width="2"/>
<!-- front leg -->
<path d="M270 345L245 425L220 520" class="leg"/><path d="M270 345L245 425L220 520" class="detail"/>
<circle cx="270" cy="345" r="15" class="joint"/><circle cx="270" cy="345" r="5" class="core"/>
<circle cx="245" cy="425" r="14" class="joint"/><circle cx="245" cy="425" r="5" class="core"/>
<path d="M220 520l-18 5h35" class="foot"/>
<!-- rear leg -->
<path d="M510 345L535 425L560 520" class="leg"/><path d="M510 345L535 425L560 520" class="detail"/>
<circle cx="510" cy="345" r="15" class="joint"/><circle cx="510" cy="345" r="5" class="core"/>
<circle cx="535" cy="425" r="14" class="joint"/><circle cx="535" cy="425" r="5" class="core"/>
<path d="M560 520l-18 5h35" class="foot"/>
<!-- far-side leg outlines -->
<path d="M300 355L290 430L275 510M480 355L490 430L505 510" fill="none" stroke="#91a8b8" stroke-width="10" stroke-dasharray="6 5" stroke-linecap="round"/>
<text x="95" y="250" class="lb">Compact body</text><path d="M180 254L245 290" class="leader"/>
<text x="80" y="390" class="jl">Hip J1</text><path d="M135 386L255 350" class="leader"/>
<text x="80" y="455" class="jl">Knee J2</text><path d="M145 451L238 428" class="leader"/>
<text x="590" y="390" class="sm">Two joints</text><text x="590" y="407" class="sm">per leg</text><path d="M585 412L545 425" class="leader"/>
<text x="395" y="570" text-anchor="middle" class="sm">Ground contact plane</text>
<path d="M110 525H650" stroke="#718695" stroke-width="1.5" stroke-dasharray="6 5"/>
<!-- top view -->
<rect x="770" y="120" width="385" height="490" rx="10" class="panel"/>
<text x="795" y="155" class="pt">TOP VIEW</text>
<text x="795" y="178" class="sm">Plan layout — indicative only</text>
<text x="962" y="218" text-anchor="middle" class="sm">FRONT</text>
<path d="M962 225v24m-7-8l7-9 7 9" class="leader"/>
<!-- body footprint -->
<rect x="910" y="305" width="105" height="190" rx="16" class="body"/>
<rect x="925" y="325" width="75" height="150" rx="8" fill="#c6d3dc" stroke="#718695" stroke-width="2"/>
<text x="962" y="405" text-anchor="middle" class="sm">Body</text>
<!-- four legs and joints -->
<path d="M910 335L860 290L825 255M1015 335L1065 290L1100 255M910 465L860 510L825 545M1015 465L1065 510L1100 545" class="leg"/>
<circle cx="910" cy="335" r="12" class="joint"/><circle cx="860" cy="290" r="12" class="joint"/>
<circle cx="1015" cy="335" r="12" class="joint"/><circle cx="1065" cy="290" r="12" class="joint"/>
<circle cx="910" cy="465" r="12" class="joint"/><circle cx="860" cy="510" r="12" class="joint"/>
<circle cx="1015" cy="465" r="12" class="joint"/><circle cx="1065" cy="510" r="12" class="joint"/>
<circle cx="825" cy="255" r="8" class="foot"/><circle cx="1100" cy="255" r="8" class="foot"/>
<circle cx="825" cy="545" r="8" class="foot"/><circle cx="1100" cy="545" r="8" class="foot"/>
<text x="795" y="585" class="sm">Four legs, two DOF each</text>
<!-- summary -->
<rect x="45" y="635" width="1110" height="105" rx="8" fill="#f3f6f8" stroke="#c9d4dc" stroke-width="2"/>
<text x="70" y="665" class="pt">CONCEPT SUMMARY</text>
<text x="70" y="691" class="lb">Configuration: compact quadruped with four articulated legs</text>
<text x="70" y="715" class="lb">Joint arrangement: 2 DOF per leg (8 total leg joints) — illustrative arrangement</text>
<text x="1125" y="765" text-anchor="end" font-size="14" font-weight="bold" fill="#9a3f32">PROPOSED concept sketch, not to scale, no CAD</text>
</svg>
