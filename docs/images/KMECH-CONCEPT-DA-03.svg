<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">KMECH-CONCEPT-DA-03 — Mobile Dual-Arm</title>
<desc id="desc">Front and top schematic views of a wheeled mobile base with two three-DOF articulated arms.</desc>
<defs>
<style>
text{font-family:Arial,sans-serif;fill:#20394b}.h{font-size:27px;font-weight:bold}.sub{font-size:15px;fill:#526575}.pt{font-size:19px;font-weight:bold}.lb{font-size:14px}.sm{font-size:12px;fill:#526575}.joint{fill:#f3f6f8;stroke:#31566f;stroke-width:4}.core{fill:#31566f}.arm{fill:none;stroke:#477b9e;stroke-width:17;stroke-linecap:round;stroke-linejoin:round}.detail{fill:none;stroke:#a9c4d5;stroke-width:5;stroke-linecap:round}.body{fill:#dce5eb;stroke:#344e60;stroke-width:3}.leader{fill:none;stroke:#718695;stroke-width:1.5}.panel{fill:#fbfcfd;stroke:#c9d4dc;stroke-width:2}.wheel{fill:#53616b;stroke:#344e60;stroke-width:3}.grip{fill:none;stroke:#31566f;stroke-width:6;stroke-linecap:round}
</style>
</defs>
<rect width="1200" height="800" fill="#fff"/>
<text x="50" y="48" class="h">KMECH-CONCEPT-DA-03</text>
<text x="50" y="76" class="sub">Mobile Dual-Arm Robot | Concept architecture schematic</text>
<path d="M50 96H1150" stroke="#c9d4dc" stroke-width="2"/>
<rect x="45" y="120" width="700" height="490" rx="10" class="panel"/>
<text x="70" y="155" class="pt">FRONT VIEW</text>
<text x="70" y="178" class="sm">Wheeled mobile base with two articulated 3-DOF arms</text>
<!-- chassis and torso -->
<rect x="335" y="285" width="130" height="155" rx="18" class="body"/>
<rect x="360" y="440" width="80" height="100" class="body"/>
<rect x="285" y="540" width="230" height="115" rx="12" class="body"/>
<rect x="300" y="650" width="200" height="12" rx="3" fill="#aebdc7" stroke="#344e60" stroke-width="2"/>
<rect x="245" y="575" width="36" height="110" rx="12" class="wheel"/>
<rect x="519" y="575" width="36" height="110" rx="12" class="wheel"/>
<circle cx="325" cy="590" r="9" class="joint"/><circle cx="475" cy="590" r="9" class="joint"/>
<rect x="380" y="610" width="40" height="16" fill="#aebdc7" stroke="#344e60" stroke-width="2"/>
<!-- left 3-DOF arm -->
<path d="M335 315L255 350L210 445" class="arm"/><path d="M335 315L255 350L210 445" class="detail"/>
<circle cx="335" cy="315" r="15" class="joint"/><circle cx="335" cy="315" r="5" class="core"/>
<circle cx="255" cy="350" r="14" class="joint"/><circle cx="255" cy="350" r="5" class="core"/>
<circle cx="210" cy="445" r="14" class="joint"/><circle cx="210" cy="445" r="5" class="core"/>
<path d="M210 445l-25 25m25-25l5 32" class="grip"/>
<!-- right 3-DOF arm -->
<path d="M465 315L545 350L590 445" class="arm"/><path d="M465 315L545 350L590 445" class="detail"/>
<circle cx="465" cy="315" r="15" class="joint"/><circle cx="465" cy="315" r="5" class="core"/>
<circle cx="545" cy="350" r="14" class="joint"/><circle cx="545" cy="350" r="5" class="core"/>
<circle cx="590" cy="445" r="14" class="joint"/><circle cx="590" cy="445" r="5" class="core"/>
<path d="M590 445l25 25m-25-25l-5 32" class="grip"/>
<text x="95" y="235" class="lb">Left arm</text><path d="M160 239L235 300" class="leader"/>
<text x="610" y="235" class="lb">Right arm</text><path d="M610 240L565 300" class="leader"/>
<text x="90" y="330" class="sm">J1 shoulder</text><path d="M170 326L320 315" class="leader"/>
<text x="90" y="385" class="sm">J2 elbow</text><path d="M155 381L245 355" class="leader"/>
<text x="90" y="455" class="sm">J3 wrist</text><path d="M150 451L198 445" class="leader"/>
<text x="400" y="375" text-anchor="middle" class="lb">Torso</text>
<text x="400" y="700" text-anchor="middle" class="lb">Wheeled mobile base / chassis</text>
<path d="M400 665V680" class="leader"/>
<!-- top view -->
<rect x="770" y="120" width="385" height="490" rx="10" class="panel"/>
<text x="795" y="155" class="pt">TOP VIEW</text>
<text x="795" y="178" class="sm">Plan layout — indicative only</text>
<text x="962" y="220" text-anchor="middle" class="sm">FRONT</text>
<path d="M962 228v25m-7-8l7-9 7 9" class="leader"/>
<rect x="900" y="280" width="125" height="225" rx="14" class="body"/>
<rect x="915" y="305" width="95" height="125" class="body"/>
<rect x="870" y="315" width="27" height="130" rx="8" class="wheel"/>
<rect x="1028" y="315" width="27" height="130" rx="8" class="wheel"/>
<path d="M900 330L850 350L820 420M1025 330L1075 350L1105 420" class="arm"/>
<circle cx="900" cy="330" r="12" class="joint"/><circle cx="850" cy="350" r="12" class="joint"/><circle cx="820" cy="420" r="12" class="joint"/>
<circle cx="1025" cy="330" r="12" class="joint"/><circle cx="1075" cy="350" r="12" class="joint"/><circle cx="1105" cy="420" r="12" class="joint"/>
<path d="M820 420l-18 20m18-20l8 23m285-23l18 20m-18-20l-8 23" class="grip"/>
<path d="M805 465Q820 520 870 535M1120 465Q1105 520 1055 535" fill="none" stroke="#718695" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="800" y="570" class="sm">Mobile chassis with mirrored arms</text>
<text x="962" y="590" text-anchor="middle" class="sm">Indicative arm reach zones</text>
<!-- summary -->
<rect x="45" y="635" width="1110" height="105" rx="8" fill="#f3f6f8" stroke="#c9d4dc" stroke-width="2"/>
<text x="70" y="665" class="pt">CONCEPT SUMMARY</text>
<text x="70" y="691" class="lb">Configuration: mobile base with two independently articulated arms</text>
<text x="70" y="715" class="lb">Joint arrangement: 3 DOF per arm (6 total arm joints) — illustrative arrangement</text>
<text x="1125" y="765" text-anchor="end" font-size="14" font-weight="bold" fill="#9a3f32">PROPOSED concept sketch, not to scale, no CAD</text>
</svg>
