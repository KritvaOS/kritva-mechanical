<!-- six legs: three on each side -->
<path d="M920 330L875 300L835 275M920 390L865 390L820 390M920 450L875 480L835 505M1004 330L1049 300L1089 275M1004 390L1059 390L1104 390M1004 450L1049 480L1089 505" class="leg"/>
<circle cx="920" cy="330" r="12" class="joint"/><circle cx="875" cy="300" r="11" class="joint"/>
<circle cx="920" cy="390" r="12" class="joint"/><circle cx="865" cy="390" r="11" class="joint"/>
<circle cx="920" cy="450" r="12" class="joint"/><circle cx="875" cy="480" r="11" class="joint"/>
<circle cx="1004" cy="330" r="12" class="joint"/><circle cx="1049" cy="300" r="11" class="joint"/>
<circle cx="1004" cy="390" r="12" class="joint"/><circle cx="1059" cy="390" r="11" class="joint"/>
<circle cx="1004" cy="450" r="12" class="joint"/><circle cx="1049" cy="480" r="11" class="joint"/>
<circle cx="835" cy="275" r="8" class="foot"/><circle cx="820" cy="390" r="8" class="foot"/><circle cx="835" cy="505" r="8" class="foot"/>
<circle cx="1089" cy="275" r="8" class="foot"/><circle cx="1104" cy="390" r="8" class="foot"/><circle cx="1089" cy="505" r="8" class="foot"/>
<text x="795" y="555" class="sm">Three leg pairs: front, middle, rear</text>
<text x="795" y="575" class="sm">Six legs, two DOF each</text>
<!-- summary -->
<rect x="45" y="635" width="1110" height="105" rx="8" fill="#f3f6f8" stroke="#c9d4dc" stroke-width="2"/>
<text x="70" y="665" class="pt">CONCEPT SUMMARY</text>
<text x="70" y="691" class="lb">Configuration: hexapod with six articulated legs arranged in three pairs</text>
<text x="70" y="715" class="lb">Joint arrangement: 2 DOF per leg (12 total leg joints) — illustrative arrangement</text>
<text x="1125" y="765" text-anchor="end" font-size="14" font-weight="bold" fill="#9a3f32">PROPOSED concept sketch, not to scale, no CAD</text>
</svg>
