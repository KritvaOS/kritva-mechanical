<rect x="925" y="325" width="75" height="145" rx="8" class="body"/>
<rect x="900" y="455" width="125" height="38" rx="4" class="body"/>
<path d="M925 350L875 310L835 335L815 405L845 465M1000 350L1050 310L1090 335L1110 405L1080 465" class="arm"/>
<circle cx="925" cy="350" r="12" class="joint"/><circle cx="875" cy="310" r="11" class="joint"/><circle cx="835" cy="335" r="11" class="joint"/><circle cx="815" cy="405" r="11" class="joint"/><circle cx="845" cy="465" r="11" class="joint"/>
<circle cx="1000" cy="350" r="12" class="joint"/><circle cx="1050" cy="310" r="11" class="joint"/><circle cx="1090" cy="335" r="11" class="joint"/><circle cx="1110" cy="405" r="11" class="joint"/><circle cx="1080" cy="465" r="11" class="joint"/>
<path d="M845 465l-15 20m15-20l8 23m227-23l15 20m-15-20l-8 23" class="grip"/>
<text x="800" y="540" class="sm">Mirrored multi-joint arm layout</text>
<text x="800" y="560" class="sm">around a shared central support</text>
<rect x="45" y="635" width="1110" height="105" rx="8" fill="#f3f6f8" stroke="#c9d4dc" stroke-width="2"/>
<text x="70" y="665" class="pt">CONCEPT SUMMARY</text>
<text x="70" y="691" class="lb">Configuration: advanced dual-arm arrangement with two independently articulated arms</text>
<text x="70" y="715" class="lb">Joint arrangement: 5 DOF per arm (10 total arm joints) — illustrative arrangement</text>
<text x="1125" y="765" text-anchor="end" font-size="14" font-weight="bold" fill="#9a3f32">PROPOSED concept sketch, not to scale, no CAD</text>
</svg>
