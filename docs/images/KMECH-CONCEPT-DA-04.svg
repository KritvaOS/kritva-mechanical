<circle cx="220" cy="285" r="14" class="joint"/><circle cx="220" cy="285" r="5" class="core"/>
<circle cx="165" cy="350" r="14" class="joint"/><circle cx="165" cy="350" r="5" class="core"/>
<circle cx="205" cy="425" r="14" class="joint"/><circle cx="205" cy="425" r="5" class="core"/>
<path d="M205 425l-25 25m25-25l8 30" class="grip"/>
