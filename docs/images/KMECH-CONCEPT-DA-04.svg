<text x="610" y="225" class="lb">Right arm</text><path d="M610 230L590 270" class="leader"/>
<text x="75" y="300" class="jl">J1</text><path d="M95 296L330 385" class="leader"/>
<text x="75" y="345" class="jl">J2</text><path d="M95 341L270 315" class="leader"/>
<text x="75" y="390" class="jl">J3</text><path d="M95 386L207 290" class="leader"/>
<text x="75" y="435" class="jl">J4</text><path d="M95 431L155 355" class="leader"/>
<text x="75" y="475" class="jl">J5</text><path d="M95 471L195 430" class="leader"/>
<text x="400" y="430" text-anchor="middle" class="lb">Common</text>
<text x="400" y="449" text-anchor="middle" class="lb">support</text>
<text x="400" y="595" text-anchor="middle" class="sm">Fixed mounting base</text>
<rect x="770" y="120" width="385" height="490" rx="10" class="panel"/>
