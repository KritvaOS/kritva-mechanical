<rect x="315" y="475" width="170" height="22" rx="4" class="body"/>
<rect x="335" y="497" width="130" height="65" rx="5" class="body"/>
<rect x="300" y="562" width="200" height="16" rx="3" fill="#aebdc7" stroke="#344e60" stroke-width="2"/>
<!-- left arm: shoulder, upper arm articulation, elbow, forearm articulation, wrist -->
<path d="M340 390L285 315L220 285L165 350L205 425" class="arm"/>
<path d="M340 390L285 315L220 285L165 350L205 425" class="detail"/>
<circle cx="340" cy="390" r="16" class="joint"/><circle cx="340" cy="390" r="5" class="core"/>
