<circle cx="635" cy="350" r="14" class="joint"/><circle cx="635" cy="350" r="5" class="core"/>
<circle cx="595" cy="425" r="14" class="joint"/><circle cx="595" cy="425" r="5" class="core"/>
<path d="M595 425l25 25m-25-25l-8 30" class="grip"/>
