<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">KMECH-CONCEPT-DA-04 — Advanced Dual-Arm</title>
<desc id="desc">Front and top schematic views of an advanced dual-arm configuration with two five-degree-of-freedom articulated arms on a common fixed support.</desc>
<defs>
<style>
text{font-family:Arial,sans-serif;fill:#20394b}.h{font-size:27px;font-weight:bold}.sub{font-size:15px;fill:#526575}.pt{font-size:19px;font-weight:bold}.lb{font-size:14px}.sm{font-size:12px;fill:#526575}.jl{font-size:12px;font-weight:bold}.joint{fill:#f3f6f8;stroke:#31566f;stroke-width:4}.core{fill:#31566f}.arm{fill:none;stroke:#477b9e;stroke-width:17;stroke-linecap:round;stroke-linejoin:round}.detail{fill:none;stroke:#a9c4d5;stroke-width:5;stroke-linecap:round}.body{fill:#dce5eb;stroke:#344e60;stroke-width:3}.leader{fill:none;stroke:#718695;stroke-width:1.5}.panel{fill:#fbfcfd;stroke:#c9d4dc;stroke-width:2}.grip{fill:none;stroke:#31566f;stroke-width:6;stroke-linecap:round}
</style>
</defs>
<rect width="1200" height="800" fill="#fff"/>
<text x="50" y="48" class="h">KMECH-CONCEPT-DA-04</text>
<text x="50" y="76" class="sub">Advanced Dual-Arm | Concept architecture schematic</text>
