<path d="M460 390L515 315L580 285L635 350L595 425" class="arm"/>
<path d="M460 390L515 315L580 285L635 350L595 425" class="detail"/>
<circle cx="460" cy="390" r="16" class="joint"/><circle cx="460" cy="390" r="5" class="core"/>
