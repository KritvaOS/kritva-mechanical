<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="svgTitle svgDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="svgTitle">KMECH-CONCEPT-DA-01 — Fixed Tabletop Dual-Arm</title>
  <desc id="svgDesc">Proposed schematic showing front and top views of a fixed tabletop platform with two three-degree-of-freedom arms.</desc>

  <defs>
    <style>
      .title { font: bold 27px sans-serif; fill: #172b3a; }
      .subtitle { font: 15px sans-serif; fill: #526575; }
      .panel-title { font: bold 19px sans-serif; fill: #20394b; }
      .label { font: 14px sans-serif; fill: #263d4d; }
      .small { font: 12px sans-serif; fill: #526575; }
      .joint-label { font: bold 12px sans-serif; fill: #20394b; }
      .structure { fill: #dce5eb; stroke: #344e60; stroke-width: 3; }
      .arm { fill: none; stroke: #477b9e; stroke-width: 18; stroke-linecap: round; stroke-linejoin: round; }
      .arm-detail { fill: none; stroke: #a9c4d5; stroke-width: 5; stroke-linecap: round; }
      .joint { fill: #f3f6f8; stroke: #31566f; stroke-width: 4; }
      .joint-core { fill: #31566f; }
      .leader { fill: none; stroke: #718695; stroke-width: 1.5; }
      .dimension { fill: none; stroke: #718695; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .gripper { fill: none; stroke: #31566f; stroke-width: 6; stroke-linecap: round; }
      .panel { fill: #fbfcfd; stroke: #c9d4dc; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>

  <text x="50" y="48" class="title">KMECH-CONCEPT-DA-01</text>
  <text x="50" y="76" class="subtitle">Fixed Tabletop Dual-Arm | Concept architecture schematic</text>
  <line x1="50" y1="96" x2="1150" y2="96" stroke="#c9d4dc" stroke-width="2"/>

  <!-- FRONT VIEW -->
  <rect x="45" y="120" width="700" height="490" rx="10" class="panel"/>
  <text x="70" y="155" class="panel-title">FRONT VIEW</text>
  <text x="70" y="178" class="small">Two articulated arms mounted on a common fixed tabletop base</text>

  <!-- Tabletop and fixed base -->
  <rect x="115" y="455" width="560" height="25" rx="4" class="structure"/>
  <rect x="330" y="480" width="130" height="72" rx="5" class="structure"/>
  <rect x="300" y="552" width="190" height="16" rx="3" fill="#aebdc7" stroke="#344e60" stroke-width="2"/>
  <text x="395" y="594" text-anchor="middle" class="label">Fixed common base</text>

  <!-- Left arm: shoulder, elbow, wrist -->
  <path d="M245 455 L205 350 L270 260" class="arm"/>
  <path d="M245 455 L205 350 L270 260" class="arm-detail"/>
  <circle cx="245" cy="455" r="17" class="joint"/>
  <circle cx="245" cy="455" r="6" class="joint-core"/>
  <circle cx="205" cy="350" r="16" class="joint"/>
  <circle cx="205" cy="350" r="6" class="joint-core"/>
  <circle cx="270" cy="260" r="15" class="joint"/>
  <circle cx="270" cy="260" r="5" class="joint-core"/>
  <path d="M270 260 L295 230 M270 260 L300 276" class="gripper"/>

  <!-- Right arm: shoulder, elbow, wrist -->
  <path d="M545 455 L590 350 L525 260" class="arm"/>
  <path d="M545 455 L590 350 L525 260" class="arm-detail"/>
  <circle cx="545" cy="455" r="17" class="joint"/>
  <circle cx="545" cy="455" r="6" class="joint-core"/>
  <circle cx="590" cy="350" r="16" class="joint"/>
  <circle cx="590" cy="350" r="6" class="joint-core"/>
  <circle cx="525" cy="260" r="15" class="joint"/>
  <circle cx="525" cy="260" r="5" class="joint-core"/>
  <path d="M525 260 L500 230 M525 260 L495 276" class="gripper"/>

  <!-- Front view labels -->
  <text x="90" y="220" class="label">Left arm</text>
  <path d="M155 224 L185 245 L205 315" class="leader"/>
  <text x="610" y="220" class="label">Right arm</text>
  <path d="M610 226 L590 250 L565 315" class="leader"/>

  <text x="82" y="330" class="joint-label">J2</text>
  <path d="M105 326 L185 345" class="leader"/>
  <text x="82" y="435" class="joint-label">J1</text>
  <path d="M105 431 L228 450" class="leader"/>
  <text x="310" y="205" class="joint-label">J3</text>
  <path d="M305 210 L280 246" class="leader"/>

  <text x="625" y="330" class="joint-label">J2</text>
  <path d="M620 326 L605 345" class="leader"/>
  <text x="625" y="435" class="joint-label">J1</text>
  <path d="M620 431 L562 450" class="leader"/>
  <text x="455" y="205" class="joint-label">J3</text>
  <path d="M465 210 L515 246" class="leader"/>

  <text x="350" y="300" class="small">3-DOF arm</text>
  <text x="350" y="318" class="small">per side</text>
  <path d="M380 325 L410 365" class="leader"/>

  <text x="395" y="445" text-anchor="middle" class="small">Tabletop mounting surface</text>

  <!-- TOP VIEW -->
  <rect x="770" y="120" width="385" height="490" rx="10" class="panel"/>
  <text x="795" y="155" class="panel-title">TOP VIEW</text>
  <text x="795" y="178" class="small">Plan layout — indicative only</text>

  <!-- Table outline -->
  <rect x="825" y="215" width="275" height="320" rx="8" fill="#eef2f5" stroke="#344e60" stroke-width="3"/>
  <text x="962" y="558" text-anchor="middle" class="small">Tabletop footprint</text>

  <!-- Central base -->
  <rect x="925" y="345" width="75" height="70" rx="5" fill="#c6d3dc" stroke="#344e60" stroke-width="2"/>
  <text x="962" y="384" text-anchor="middle" class="small">Base</text>

  <!-- Left arm top projection -->
  <path d="M925 365 L875 315 L855 255" class="arm"/>
  <circle cx="925" cy="365" r="12" class="joint"/>
  <circle cx="875" cy="315" r="12" class="joint"/>
  <circle cx="855" cy="255" r="11" class="joint"/>
  <path d="M855 255 L840 235 M855 255 L870 235" class="gripper"/>

  <!-- Right arm top projection -->
  <path d="M1000 365 L1050 315 L1070 255" class="arm"/>
  <circle cx="1000" cy="365" r="12" class="joint"/>
  <circle cx="1050" cy="315" r="12" class="joint"/>
  <circle cx="1070" cy="255" r="11" class="joint"/>
  <path d="M1070 255 L1055 235 M1070 255 L1085 235" class="gripper"/>

  <text x="820" y="205" class="small">Rear</text>
  <text x="820" y="580" class="small">Front</text>
  <path d="M962 570 L962 590 M954 582 L962 590 L970 582" fill="none" stroke="#718695" stroke-width="1.5"/>

  <text x="790" y="440" class="small">Left arm</text>
  <path d="M850 436 L875 390" class="leader"/>
  <text x="1030" y="440" class="small">Right arm</text>
  <path d="M1030 436 L1045 390" class="leader"/>

  <!-- Architecture summary -->
  <rect x="45" y="635" width="1110" height="105" rx="8" fill="#f3f6f8" stroke="#c9d4dc" stroke-width="2"/>
  <text x="70" y="665" class="panel-title">CONCEPT SUMMARY</text>
  <text x="70" y="691" class="label">Configuration: fixed tabletop base with two independently articulated arms</text>
  <text x="70" y="715" class="label">Joint arrangement: 3 DOF per arm (J1 shoulder/base, J2 elbow, J3 wrist) — illustrative arrangement</text>

  <text x="1125" y="765" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="bold" fill="#9a3f32">PROPOSED concept sketch, not to scale, no CAD</text>
</svg>
