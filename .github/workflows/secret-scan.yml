# secret-scan (ROB-MECH-003): scans the repository history for secrets with gitleaks.
# Fails closed: if the scanner cannot be downloaded or verified, the job fails.
# Do not add allowlist entries to silence a finding (AC-003-04); propose them to the owner.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify gitleaks
        run: |
          set -eu
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          cd "$RUNNER_TEMP"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o "$sums" "$base/$sums"
          grep " ${tarball}\$" "$sums" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          ./gitleaks version

      - name: Scan the repository
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --verbose --exit-code 1 .
